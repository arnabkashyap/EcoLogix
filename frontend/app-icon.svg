<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Eco Logistics Graphic: Intertwined Leaf & Supply Chain Path -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Supply Chain Route Path -->
    <path d="M 96 380 C 96 220, 220 180, 256 120 C 292 60, 380 90, 416 160 C 452 230, 390 340, 320 380 C 250 420, 160 410, 96 380 Z" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-dasharray="8 20" />

    <!-- Green Eco Leaf -->
    <path d="M 256 70 C 140 100, 70 210, 90 340 C 200 370, 340 330, 420 180 C 430 110, 370 60, 256 70 Z" 
          fill="url(#emeraldGrad)" 
          fill-opacity="0.88" />
    
    <!-- Leaf Center Stem / Logistics Route -->
    <path d="M 100 330 Q 220 250 410 185" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" />
    
    <!-- Route Waypoint Nodes -->
    <circle cx="100" cy="330" r="18" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
    <circle cx="235" cy="260" r="14" fill="#34d399" stroke="#ffffff" stroke-width="5" />
    <circle cx="410" cy="185" r="22" fill="#10b981" stroke="#ffffff" stroke-width="7" />
  </g>
</svg>
