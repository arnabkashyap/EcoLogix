name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri Desktop App
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ECOLOGIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ECOLOGIX_KEYSTORE_PASSWORD || 'ecologix2026' }}
          KEY_ALIAS: ${{ secrets.ECOLOGIX_KEY_ALIAS || 'ecologix' }}
          KEY_PASSWORD: ${{ secrets.ECOLOGIX_KEY_PASSWORD || 'ecologix2026' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding user-provided keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release-key.jks
          else
            echo "No custom keystore secret found. Generating CI release keystore..."
            keytool -genkeypair -v \
              -keystore $GITHUB_WORKSPACE/release-key.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=EcoLogix, OU=Mobile, O=EcoLogix, L=San Francisco, ST=CA, C=US"
          fi
        shell: bash

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android App
        working-directory: frontend
        env:
          ECOLOGIX_KEYSTORE_PATH: ${{ format('{0}/release-key.jks', github.workspace) }}
          ECOLOGIX_KEYSTORE_PASSWORD: ${{ secrets.ECOLOGIX_KEYSTORE_PASSWORD || 'ecologix2026' }}
          ECOLOGIX_KEY_ALIAS: ${{ secrets.ECOLOGIX_KEY_ALIAS || 'ecologix' }}
          ECOLOGIX_KEY_PASSWORD: ${{ secrets.ECOLOGIX_KEY_PASSWORD || 'ecologix2026' }}
        run: npm run android:build

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab

  release:
    name: Publish Draft Release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: ./artifacts/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: ./artifacts/android

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./artifacts/windows/*.msi
            ./artifacts/windows/*.exe
            ./artifacts/android/*.apk
            ./artifacts/android/*.aab
